<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Alpha Model</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf1fb;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:end}h1{margin:4px 0 0}.muted{color:#8ea1b8}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.card,.row{background:#0d1a2b;border:1px solid #1b2b40;border-radius:16px;padding:14px}.n{font-size:24px;font-weight:800}.health{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 20px}.pill{padding:7px 10px;border-radius:999px;background:#12243a}.ok,.pos{color:#62d6a5}.waiting,.warning{color:#f1c66b}.error{color:#ff7d8b}.watch{display:grid;gap:8px}.row{display:grid;grid-template-columns:72px 1fr 90px;align-items:center}.ticker{font-size:17px;font-weight:800}.gap{text-align:right;font-size:17px;font-weight:800}.na{color:#71849b}.loading{padding:28px 0;color:#8ea1b8}@media(max-width:650px){.wrap{padding:14px}.cards{grid-template-columns:1fr 1fr}.n{font-size:22px}}</style></head>
<body><main class="wrap"><div class="top"><div><div class="muted">ALPHA MODEL V0.1</div><h1>Alpha Watchlist</h1></div><div class="muted">Supabase Live</div></div><div id="app" class="loading">載入資料中…</div></main>
<script>
const API="https://aqldnpnemmlljxwxpmfr.supabase.co/functions/v1/alpha-dashboard-api";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function load(){try{const r=await fetch(API,{cache:"no-store"});if(!r.ok)throw Error(r.status);const d=await r.json(),s=d.summary||{},h=d.health||[],w=d.watchlist||[];
document.querySelector("#app").innerHTML='<div class="cards"><div class="card"><div class="muted">Core</div><div class="n">'+(s.core_companies||0)+'</div></div><div class="card"><div class="muted">With Gap</div><div class="n">'+(s.companies_with_gap||0)+'</div></div><div class="card"><div class="muted">Inbox</div><div class="n">'+(s.inbox_items||0)+'</div></div><div class="card"><div class="muted">Cron</div><div class="n">'+(s.active_cron_jobs||0)+'</div></div></div><h3>System Health</h3><div class="health">'+h.map(x=>'<span class="pill '+esc(x.status)+'">● '+esc(x.component)+': '+esc(x.status)+'</span>').join("")+'</div><h3>Watchlist</h3><div class="watch">'+w.map(x=>'<div class="row"><div class="ticker">'+esc(x.ticker)+'</div><div><b>'+esc(x.company_name)+'</b><div class="muted">'+esc(x.consensus_metric||"Pending / reverse expectations")+'</div></div><div class="gap '+(x.expectation_gap!=null?"pos":"na")+'">'+(x.expectation_gap!=null?((+x.expectation_gap>=0?"+":"")+(+x.expectation_gap).toFixed(2)+"%"):"—")+'</div></div>').join("")+'</div><p class="muted">Gap 是模型與市場預期差，不是公司品質排名。資料不具可比性時保持空白。</p>';
}catch(e){document.querySelector("#app").innerHTML='<div class="card"><b>資料暫時無法載入</b><p class="muted">Dashboard 前端正常，但後端 API 尚未回應。錯誤：'+esc(e.message)+'</p></div>'}}load();
</script></body></html>
