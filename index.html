const candidateMonitorHtml=(x)=>{let k=x.kpi_automation||{},items=k.items||[];if(!items.length)return "";let rows=items.map(v=>'<div class="card" style="padding:12px"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(v.kpi_name||v.kpi_key)+'</b><span class="pill '+(v.auto_enabled?'ok':'warn')+'">'+(v.auto_enabled?'AUTO':'REVIEW')+'</span></div><div class="muted" style="margin-top:5px">'+esc(v.collector||'尚無資料')+(v.period_end?' · '+esc(v.period_end):'')+'</div>'+(v.source_url?'<div style="margin-top:7px"><a href="'+esc(v.source_url)+'" target="_blank" rel="noopener" style="color:#7aa7ff">官方來源 ↗</a></div>':'')+'</div>').join("");return '<div class="section"><h3>Monitoring Contract｜KPI 自動化</h3><p class="muted">目前 '+(k.auto_count||0)+' / '+(k.total||0)+' 個核心 KPI 已自動更新；REVIEW 表示官方文件已納入監控，但數字仍需人工驗證後才能進模型。</p><div class="watch">'+rows+'</div></div>'};

 return lines+market+gap;

async function candidateDetail(t){document.querySelector("#app").innerHTML='<div class="muted">載入 '+esc(t)+' Live KPI…</div>';try{let d=await j(BASE+"alpha-candidate-api?ticker="+encodeURIComponent(t)),x=d.candidate||{};window.__candidateData=x;let o=x.observations||[],mp=x.mops_presentations||[];let ka=x.kpi_automation||{},auto=(ka.auto_count||0)+' / '+(ka.total||0)+' KPI',last=x.last_auto_update?new Date(x.last_auto_update).toLocaleString('zh-TW'):'—',dr=x.document_review||{},capReview=dr.capacity_review_status==="current"?'產能資料已同步最新法說':dr.capacity_review_status==="review_required"?'新法說已出現，產能資料待複核':'';let cards=o.map(v=>{let m=v.metadata||{},parts=[];if(m.yoy_pct!=null)parts.push('YoY '+(+m.yoy_pct>=0?'+':'')+(+m.yoy_pct).toFixed(1)+'%');if(m.operating_cash_flow_twd_m!=null)parts.push('OCF '+(+m.operating_cash_flow_twd_m).toLocaleString()+'m');if(m.capex_ppe_twd_m!=null)parts.push('Capex '+(+m.capex_ppe_twd_m).toLocaleString()+'m');if(m.definition)parts.push(esc(m.definition));return '<div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><b>'+esc(v.kpi_name)+'</b><b>'+esc(v.value==null?"—":v.value)+' '+esc(v.unit||"")+'</b></div><div class="muted">'+esc(v.period_label||v.period_end||"")+' · Source '+esc(v.source_grade||"—")+' · '+esc(v.collector||"")+'</div>'+(parts.length?'<div style="margin-top:7px;font-size:12px">'+parts.join(' · ')+'</div>':'')+(v.source_url?'<div style="margin-top:8px"><a href="'+esc(v.source_url)+'" target="_blank" rel="noopener" style="color:#7aa7ff">查看官方來源 ↗</a></div>':'')+'</div>'}).join("");let mops=mp.length?'<div class="section"><h3>MOPS 法說會簡報｜官方來源</h3><div class="watch">'+mp.map(v=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(v.published_date||'日期待辨識')+'</b><span class="muted">'+esc(v.status||'discovered')+'</span></div><div class="muted" style="margin-top:4px">'+esc(v.title||'MOPS 法說會簡報')+'</div>'+(v.pdf_url?'<div style="margin-top:8px"><a href="'+esc(v.pdf_
