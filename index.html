<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Alpha Model</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf1fb;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:end}h1{margin:4px 0 0;font-size:36px}.muted{color:#8ea1b8}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.card,.row,.panel{background:#0d1a2b;border:1px solid #1b2b40;border-radius:16px;padding:14px}.n{font-size:24px;font-weight:800}.health{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 20px}.pill{padding:7px 10px;border-radius:999px;background:#12243a}.ok,.pos,.strengthened{color:#62d6a5}.waiting,.warning,.unchanged{color:#f1c66b}.error,.weakened{color:#ff7d8b}.watch{display:grid;gap:8px}.row{display:grid;grid-template-columns:72px 1fr 90px;align-items:center;cursor:pointer}.ticker{font-size:17px;font-weight:800}.gap{text-align:right;font-size:17px;font-weight:800}.na{color:#71849b}.back{border:0;background:none;color:#8ea1b8;font-size:16px;padding:8px 0}.hero{display:flex;justify-content:space-between;align-items:end;margin:18px 0}.hero .ticker{font-size:34px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis{display:grid;gap:10px}.kpihead{display:flex;justify-content:space-between;gap:8px}.status{font-weight:800}.section{margin-top:22px}.panel p{line-height:1.55}.gate{font-size:16px;font-weight:750}@media(max-width:650px){.wrap{padding:14px}.cards,.grid2{grid-template-columns:1fr 1fr}.n{font-size:22px}h1{font-size:32px}.row{grid-template-columns:65px 1fr 78px}}
</style></head><body><main class="wrap"><div id="shell"><div class="top"><div><div class="muted">ALPHA MODEL V0.1 · DASHBOARD V1.2</div><h1>Alpha Watchlist</h1></div><div class="muted">Supabase Live</div></div><div id="app" class="muted">載入資料中…</div></div></main><script>
const ZH={strengthened:"轉強",unchanged:"不變",weakened:"轉弱",mixed:"多空交錯",hold_base:"維持 Our Base",review_base:"重新檢視 Our Base",update_base:"更新 Our Base"};
const KPI_ZH={"OCI growth":"OCI 成長","RPO → revenue conversion":"RPO → 營收轉化","FCF / Capex":"自由現金流／資本支出","Gross margin":"毛利率","Azure growth":"Azure 成長","Data Center growth":"資料中心成長","Automotive margin":"汽車業務利潤率","Services growth/margin":"服務業務成長／利潤率","FCF margin":"自由現金流率"};
const bi=(v,map=ZH)=>v?(esc(v)+"｜"+esc(map[v]||v)):"pending｜待更新";
const BASE="https://aqldnpnemmlljxwxpmfr.supabase.co/functions/v1/",esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function j(url){let r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()}
async function home(){history.replaceState(null,"",location.pathname);let d=await j(BASE+"alpha-dashboard-api"),s=d.summary||{},h=d.health||[],w=d.watchlist||[];document.querySelector("#app").innerHTML='<div class="cards">'+[["Core",s.core_companies],["With Gap",s.companies_with_gap],["Inbox",s.inbox_items],["Cron",s.active_cron_jobs]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="n">'+(x[1]??0)+'</div></div>').join("")+'</div><h3>System Health｜系統狀態</h3><div class="health">'+h.map(x=>'<span class="pill '+esc(x.status)+'">● '+esc(x.component)+': '+esc(x.status)+'</span>').join("")+'</div><h3>Watchlist｜觀察名單</h3><div class="watch">'+w.map(x=>'<div class="row" onclick="detail(\''+esc(x.ticker)+'\')"><div class="ticker">'+esc(x.ticker)+'</div><div><b>'+esc(x.company_name)+'</b><div class="muted">'+esc(x.consensus_metric||"Pending / reverse expectations")+'</div></div><div class="gap '+(x.expectation_gap!=null?"pos":"na")+'">'+(x.expectation_gap!=null?((+x.expectation_gap>=0?"+":"")+(+x.expectation_gap).toFixed(2)+"%"):"—")+'</div></div>').join("")+'</div><p class="muted">點選公司查看投資論點、KPI 證據與 Our Base 更新門檻。Gap 是模型與市場預期差，不是公司品質排名。</p>'}
async function detail(t){history.pushState({t},"","#"+t);document.querySelector("#app").innerHTML='<div class="muted">載入 '+esc(t)+'…</div>';let d=await j(BASE+"alpha-company-api?ticker="+encodeURIComponent(t)),c=d.company||{},w=d.watchlist||{},th=d.thesis||{},k=d.kpis||[],g=d.gate||{};document.querySelector("#app").innerHTML='<button class="back" onclick="home()">‹ 返回 Watchlist</button><div class="hero"><div><div class="ticker">'+esc(c.ticker)+'</div><h2>'+esc(c.company_name)+'</h2><div class="muted">'+esc(c.alpha_family)+'</div></div><div class="gap '+(w.expectation_gap!=null?"pos":"na")+'">'+(w.expectation_gap!=null?((+w.expectation_gap>=0?"+":"")+(+w.expectation_gap).toFixed(2)+"%"):"—")+'</div></div><div class="grid2"><div class="card"><div class="muted">Market Expectation｜市場預期</div><div class="n">'+esc(w.market_value??"—")+'</div><div class="muted">'+esc(w.fiscal_period??"")+'</div></div><div class="card"><div class="muted">Our Base｜我們的基準預估</div><div class="n">'+esc(w.our_base_value??"—")+'</div><div class="muted">'+esc(w.consensus_metric??"")+'</div></div></div><div class="section"><h3>Variant Perception｜市場認知差</h3><div class="panel"><p>'+esc(th.variant_perception??"尚未建立")+'</p></div></div><div class="section"><h3>3 KPI Evidence｜3 項關鍵指標證據</h3><div class="kpis">'+k.map(x=>'<div class="panel"><div class="kpihead"><b>'+x.kpi_order+'. '+esc(x.kpi_name)+'</b><span class="status '+esc(x.evidence_status)+'">'+esc(x.evidence_status??"pending")+'</span></div><p>'+esc(x.evidence_text??"尚無新證據")+'</p><div class="muted">Our Base Update Trigger｜Our Base 更新條件：'+esc(x.our_base_update_trigger)+'</div></div>').join("")+'</div></div><div class="section"><h3>Our Base Gate｜基準預估更新門檻</h3><div class="panel gate">'+esc(g.decision??"尚無本週 Gate decision")+(g.rationale?'<p class="muted">'+esc(g.rationale)+'</p>':"")+'</div></div><div class="section"><h3>Invalidation｜論點失效條件</h3><div class="panel"><p>'+esc(th.invalidation??"尚未建立")+'</p></div></div>'}
window.onpopstate=()=>location.hash?detail(location.hash.slice(1)):home();(async()=>{try{location.hash?await detail(location.hash.slice(1)):await home()}catch(e){document.querySelector("#app").innerHTML='<div class="card">資料載入失敗：'+esc(e.message)+'</div>'}})();
</script></body></html>
